# /etc/ssh/sshd_config.d/securecorp.conf
# Endurecimiento de SSH para SecureCorp (lo instala ssh/configurar_ssh.sh)

# Nadie entra como root directamente
PermitRootLogin no

# Solo llaves públicas; nada de contraseñas (evita ataques de diccionario)
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# AUTORIZACIÓN: solo los miembros de este grupo pueden entrar
AllowGroups secureadmins

# Limita intentos y tiempo para autenticarse
MaxAuthTries 3
LoginGraceTime 30

# Registro detallado: guarda también la huella de la llave usada
LogLevel VERBOSE

# Sin reenvíos que no necesitamos
X11Forwarding no
AllowAgentForwarding no
